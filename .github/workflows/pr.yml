name: Pull Request Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - "**/*.py"
      - "**/*.toml"
      - "**/*.lock"
      - ".github/workflows/pr.yml"

env:
  FLAKINESS_PROJECT: nirtal85/Selenium-Python-Example

permissions:
  contents: read
  pull-requests: write
  checks: write
  pages: write
  id-token: write

jobs:
  merge_test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Test with pytest
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: xvfb-run uv run pytest -m devRun --base-url "$BASE_URL"
      - name: Auto-assign reviewers
        uses: kentaro-m/auto-assign-action@v2.0.2
        if: success()
      - name: Link Git Information And Browser Version To Allure Results
        if: always()
        working-directory: allure-results
        env:
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
          GIT_COMMIT_ID: ${{ github.sha }}
        run: |
          {
            printf 'BUILD_URL=%s\n' "$BUILD_URL"
            printf 'GIT_BRANCH=%s\n' "$GIT_BRANCH"
            printf 'GIT_COMMIT_ID=%s\n' "$GIT_COMMIT_ID"
            printf 'GIT_COMMIT_MESSAGE=%s\n' "$(git show -s --format=%s HEAD)"
            printf 'GIT_COMMIT_AUTHOR_NAME=%s\n' "$(git show -s --format='%ae' HEAD)"
            printf 'GIT_COMMIT_TIME=%s\n' "$(git show -s --format=%ci HEAD)"
            printf 'CHROME_VERSION=%s\n' "$(google-chrome --product-version 2>/dev/null || true)"
          } >> environment.properties
      - name: Generate Allure HTML report (Allure 3 CLI via npx)
        if: always()
        run: npx -y allure generate allure-results --output allure-report
      - name: Allure PR summary
        if: always()
        uses: allure-framework/allure-action@v0.8.0
        with:
          report-directory: "./allure-report"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report
  deploy_pages:
    needs: merge_test
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
