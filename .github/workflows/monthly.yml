name: Monthly Regression Tests

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      pytest_marker:
        description: "Pytest marker expression"
        required: true
        default: "not devRun"
        type: string
      parallelism:
        description: "Number of machines to split tests"
        required: false
        default: 2
        type: number

env:
  FLAKINESS_PROJECT: nirtal85/Selenium-Python-Example

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        env:
          PARALLELISM: ${{ github.event.inputs.parallelism || 2 }}
        run: |
          count="${PARALLELISM:-2}"
          if ! [[ "$count" =~ ^[1-9][0-9]*$ ]]; then
            echo "parallelism must be a positive integer" >&2
            exit 1
          fi
          groups=$(seq 1 "$count" | jq -Rsc 'split("\n")[:-1] | map(tonumber)')
          matrix_json=$(jq -cn --argjson groups "$groups" '{group: $groups}')
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
  monthly-test:
    needs: setup-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
    env:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --dev
      - name: Run Tests
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          GROUP: ${{ matrix.group }}
          PARALLELISM: ${{ github.event.inputs.parallelism || 2 }}
          PYTEST_MARKER: ${{ github.event.inputs.pytest_marker || 'not devRun' }}
        run: >
          xvfb-run uv run pytest
          -m "$PYTEST_MARKER"
          --base-url "$BASE_URL"
          --splits "$PARALLELISM"
          --group "$GROUP"
      - name: Upload shard allure-results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.group }}
          path: allure-results
          retention-days: 7

  build-report:
    needs: monthly-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download all shard results into allure-results
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - name: Link Git Information And Browser Version To Allure Results
        if: always()
        working-directory: allure-results
        env:
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_COMMIT_ID: ${{ github.sha }}
        run: |
          {
            printf 'BUILD_URL=%s\n' "$BUILD_URL"
            printf 'GIT_BRANCH=%s\n' "$GIT_BRANCH"
            printf 'GIT_COMMIT_ID=%s\n' "$GIT_COMMIT_ID"
            printf 'GIT_COMMIT_MESSAGE=%s\n' "$(git show -s --format=%s HEAD)"
            printf 'GIT_COMMIT_AUTHOR_NAME=%s\n' "$(git show -s --format='%ae' HEAD)"
            printf 'GIT_COMMIT_TIME=%s\n' "$(git show -s --format=%ci HEAD)"
            printf 'CHROME_VERSION=%s\n' "$(google-chrome --product-version 2>/dev/null || true)"
          } >> environment.properties
      - name: Generate Allure HTML report
        if: always()
        run: npx -y allure generate allure-results --output allure-report
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  deploy_pages:
    needs: build-report
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
