[dependency-groups]
dev = [
  "ruff==0.16.4",
  "pre-commit==4.6.2",
  "pytest-flakiness==1.2.0",
]

[project]
name = "selenium-python-example"
description = "Selenium Python example project with pytest and Allure report"
version = "0.1.0"
readme = "README.md"
license = "MIT"
authors = [{ name = "Nir Tal" }]
dependencies = [
  "allure-pytest==2.16.0",
  "assertpy==1.1",
  "dataclasses-json==0.6.7",
  "deprecated==1.3.1",
  "mailinator-python-client-2==1.0.9",
  "mysql-connector-python==26.7.0",
  "pytest==9.1.1",
  "pytest-base-url==2.1.0",
  "pytest-check==2.9.1",
  "pytest-dependency==0.6.1",
  "pytest-ordering==0.6",
  "pytest-rerunfailures==16.6",
  "pytest-split==0.11.0",
  "python-dotenv==1.2.3",
  "requests==2.34.2",
  "requests-toolbelt==1.0.0",
  "selenium==4.47.0",
  "tenacity==9.1.4",
  "visual-regression-tracker==4.9.0",
  "xlrd==2.0.2"
]
requires-python = "~=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = [
  "--clean-alluredir",
  "--alluredir=allure-results",
  "--allure-link-pattern",
  "issue:https://{}",
  "--allure-link-pattern",
  "link:https://{}",
  "--allure-link-pattern",
  "tms:https://{}",
  "--color=yes",
  "-s",
  "-p no:logging"
]
base_url = 'https://www.involve.me/'
markers = [
  "security: marks security tests",
  "devRun: marks tests that run before merge to the main branch",
  "flaky: marks tests that may be rerun",
  "run: marks ordered test execution",
  "sanity: marks sanity tests"
]
testpaths = [
  "tests"
]

[tool.ruff]
exclude = [".venv", "env"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = [
  "D203",  # One blank line required before class docstring (conflicts with D211)
  "D213",  # Multi-line docstring summary should start at the second line
  "COM812"
]
select = ["E", "F", "B", "I", "UP", "SIM", "PT"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
